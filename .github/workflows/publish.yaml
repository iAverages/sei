name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push containers
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          TAG: production-${{ github.sha }}
        run: |
          set -euo pipefail

          registry="$(printf '%s' "$REGISTRY" | tr '[:upper:]' '[:lower:]')"

          nix build .#apiImage --out-link result-api
          docker load --input result-api
          docker tag sei-api:latest "$registry/sei/api:$TAG"
          docker push "$registry/sei/api:$TAG"

          nix build .#webImage --out-link result-web
          docker load --input result-web
          docker tag sei-web:latest "$registry/sei/web:$TAG"
          docker push "$registry/sei/web:$TAG"
