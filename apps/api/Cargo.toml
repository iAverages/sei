[package]
name = "api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sei"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.196", features = ["derive"] }
anyhow = "1.0.79"
axum = { version = "0.7.4", features = ["macros"] }
axum-extra = { version = "0.9.2", features = ["cookie-private", "cookie"] }
chrono = "0.4.42"
cuid = "1.3.2"
dotenvy = "0.15.7"
hex = "0.4.3"
lazy_static = "1.4.0"
oauth2 = { version = "4.4.2", features = ["pkce-plain"] }
rand = { version = "0.8.5", features = ["std_rng"] }
regex = "1.10.3"
reqwest = { version = "0.13.0", features = ["json"] }
sea-query = { version = "1.0.0-rc.14", features = ["derive"] }
sea-query-sqlx = { version = "0.8.0-rc.9", default-features = false, features = [
    "sqlx-mysql",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
    "with-bigdecimal",
    "with-uuid",
] }
serde_json = "1.0.113"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "tls-rustls",
    "mysql",
    "chrono",
    "macros",
    "derive",
] }
time = "0.3.34"
tokio = { version = "1.35.1", features = ["full"] }
tower = "0.4.13"
tower-http = { version = "0.5.1", features = ["cors", "fs"] }
tracing = "0.1.40"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.18"
thiserror = "2.0.17"
async-rate-limiter = "1.1.0"
async-trait = "0.1.89"
reqwest-middleware = { version = "0.4.2", features = ["json"] }
futures = "0.3.31"
tokio-stream = { version = "0.1.17", features = ["sync"] }
